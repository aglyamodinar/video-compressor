name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          brew install ffmpeg
          pip install pyinstaller

      - name: Build .app
        run: |
          FFMPEG_PATH=$(which ffmpeg)
          FFPROBE_PATH=$(which ffprobe)
          pyinstaller \
            --name "VideoCompressor" \
            --windowed \
            --add-binary "${FFMPEG_PATH}:." \
            --add-binary "${FFPROBE_PATH}:." \
            --noconfirm \
            gui_app.py

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../VideoCompressor-macOS.zip VideoCompressor.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: VideoCompressor-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          choco install ffmpeg -y
          pip install pyinstaller

      - name: Build .exe
        shell: bash
        run: |
          FFMPEG_PATH=$(which ffmpeg)
          FFPROBE_PATH=$(which ffprobe)
          pyinstaller \
            --name "VideoCompressor" \
            --windowed \
            --add-binary "${FFMPEG_PATH};." \
            --add-binary "${FFPROBE_PATH};." \
            --noconfirm \
            gui_app.py

      - name: Create ZIP
        shell: bash
        run: |
          cd dist
          7z a ../VideoCompressor-Windows.zip VideoCompressor/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: VideoCompressor-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-build

      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VideoCompressor-macOS.zip
            VideoCompressor-Windows.zip
          generate_release_notes: true
