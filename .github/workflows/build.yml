name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          brew install ffmpeg
          pip install pyinstaller

      - name: Build .app
        run: |
          FFMPEG_PATH=$(which ffmpeg)
          FFPROBE_PATH=$(which ffprobe)
          pyinstaller \
            --name "VideoCompressor" \
            --windowed \
            --add-binary "${FFMPEG_PATH}:." \
            --add-binary "${FFPROBE_PATH}:." \
            --noconfirm \
            gui_app.py

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../VideoCompressor-macOS.zip VideoCompressor.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: VideoCompressor-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          choco install ffmpeg-full -y --no-progress
          refreshenv

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Find ffmpeg paths
        id: ffmpeg
        shell: pwsh
        run: |
          $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $ffmpeg) {
            $ffmpeg = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg-full\tools\ffmpeg\bin\ffmpeg.exe" -ErrorAction SilentlyContinue).FullName
          }
          if (-not $ffmpeg) {
            $ffmpeg = (Get-ChildItem -Path "C:\ProgramData\chocolatey" -Recurse -Filter "ffmpeg.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          $ffprobe = $ffmpeg -replace 'ffmpeg\.exe$','ffprobe.exe'
          echo "FFMPEG_PATH=$ffmpeg" >> $env:GITHUB_OUTPUT
          echo "FFPROBE_PATH=$ffprobe" >> $env:GITHUB_OUTPUT
          echo "Found ffmpeg: $ffmpeg"
          echo "Found ffprobe: $ffprobe"

      - name: Build .exe
        shell: pwsh
        run: |
          pyinstaller `
            --name "VideoCompressor" `
            --windowed `
            --add-binary "${{ steps.ffmpeg.outputs.FFMPEG_PATH }};." `
            --add-binary "${{ steps.ffmpeg.outputs.FFPROBE_PATH }};." `
            --noconfirm `
            gui_app.py

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\VideoCompressor\*" -DestinationPath "VideoCompressor-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: VideoCompressor-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-build

      - uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VideoCompressor-macOS.zip
            VideoCompressor-Windows.zip
          generate_release_notes: true
